# ─────────────────────────────────────────────────────────────
# VELA-X Ops Console — הגדרות פריסה ל־Netlify
# ─────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # ⚠ הבדיקות אינן רצות בבנייה: Playwright ו־Vitest דורשים מסד מקומי.
  # האימות מתבצע לפני הפריסה, מקומית.
  NEXT_TELEMETRY_DISABLED = "1"
  # ⚠ משתני סביבה של Netlify אינם מגיעים ל־runtime של פונקציית Next, אך כן
  # זמינים בזמן בנייה. הערך נצרב לקובץ שרת בבנייה (write-deploy-config).
  # זו סיסמת הדגמה לפריסת דמו בלבד — לא סוד תפעולי. להחלפה: שנה כאן ופרוס.
  SEED_ADMIN_PASSWORD = "<REDACTED>"
  # ⚠ שער גס בלבד. המפתח יושב בתוך ה־APK וניתן לחילוץ, ולכן אינו גבול
  # האבטחה — הוא רק מונע פנייה אקראית מהאינטרנט. ההגנה האמיתית היא מצב
  # השרת: עמדה פעילה, אין סשן מקביל, ומגבלת קצב לכל טלפון.
  APP_API_KEY = "<REDACTED>"

# Next.js runtime — RSC, Server Actions ו־middleware
[[plugins]]
  package = "@netlify/plugin-nextjs"
