# ─────────────────────────────────────────────────────────────
# VELA-X Ops Console — הגדרות פריסה ל־Netlify
# ─────────────────────────────────────────────────────────────

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # ⚠ הבדיקות אינן רצות בבנייה: Playwright ו־Vitest דורשים מסד מקומי.
  # האימות מתבצע לפני הפריסה, מקומית.
  NEXT_TELEMETRY_DISABLED = "1"
  # ⚠ סודות הפריסה **אינם כאן** ואינם נכנסים ל־repo.
  # הם יושבים ב־.env.deploy המקומי, ש־write-deploy-config.mjs קורא
  # בזמן הבנייה וצורב לקובץ שרת. ראה DEPLOYMENT.md.

# Next.js runtime — RSC, Server Actions ו־middleware
[[plugins]]
  package = "@netlify/plugin-nextjs"
